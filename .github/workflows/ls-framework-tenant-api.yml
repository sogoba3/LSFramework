name: Tenant API

on:
  push:
    branches:
      - main
    paths:
      - 'src/LS.TenantApi/**'
      - 'deploy/tenant-api/**'

jobs:

  # BUILD AND DEPLOY (CD)
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Tenant API
        run: |
          aws codepipeline start-pipeline-execution \
            --name tenant-api-pipeline