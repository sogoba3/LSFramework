      #     "executionRoleArn": "${TASK_EXECUTION_ROLE_ARN}",
      #     "taskRoleArn": "${TASK_ROLE_ARN}",
      #     "requiresCompatibilities": ["FARGATE"],
      #     "cpu": "256",
      #     "memory": "512",
      #     "containerDefinitions": [
      #       {
      #         "name": "gateway-api",
      #         "image": "${REPOSITORY_URI}:${IMAGE_TAG}",
      #         "essential": true,
      #         "portMappings": [
      #           { 
      #             "containerPort": 4400,
      #             "hostPort": 4400
      #           }
      #         ],
      #         "environment": [
